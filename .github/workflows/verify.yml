name: Verify PulseStream
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify on Linux
        if: runner.os == 'Linux'
        run: bash mvnw -B verify
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: ./mvnw.cmd -B verify
      - name: TCP and process restart smoke tests
        run: python tools/smoke.py
